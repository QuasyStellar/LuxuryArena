services:
  frontend:
    build:
      context: ./frontend
    expose:
      - "4173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    restart: always

  backend:
    build:
      context: ./backend
    expose:
      - "3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/html:/var/www/html:ro
    depends_on:
      - frontend
      - backend
    restart: always
