server {
    listen 80;
    server_name game.luxuryvpn.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name game.luxuryvpn.io;

    ssl_certificate /etc/letsencrypt/live/game.luxuryvpn.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.luxuryvpn.io/privkey.pem;

    # Dynamic resolution to avoid 502 on container restart
    resolver 127.0.0.11 valid=30s;
    set $frontend_upstream http://frontend:4173;
    set $backend_upstream http://backend:3000;

    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
